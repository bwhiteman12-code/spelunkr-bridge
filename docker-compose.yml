# Spelunkr -> Jellyfin bridge for Unraid (or any Docker host).
# 1. Copy spelunkr2jellyfin.py, the two star4000 .ttf fonts, channels.json and the music folder
#    into /mnt/user/appdata/spelunkr/
# 2. Change PUBLIC_URL to your server's LAN IP, TZ to your timezone, and GPU to the render node
#    Jellyfin uses for Quick Sync (Dashboard > Playback > Transcoding > QSV Device)
# 3. docker compose up -d   (or use the Compose Manager plugin)
# The Intel media driver packages are for GPU encoding; if they can't be installed the bridge
# simply encodes on the CPU. nodejs + yt-dlp are for the YouTube-based custom channels.
services:
  spelunkr:
    image: python:3.12-alpine
    container_name: spelunkr
    restart: unless-stopped
    ports:
      - "8765:8765"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/user/appdata/spelunkr:/app
    environment:
      - TZ=America/Chicago
      - PUBLIC_URL=http://192.168.1.10:8765
      - GPU=/dev/dri/renderD129
    command: >
      sh -c "apk add --no-cache ffmpeg font-dejavu tzdata nodejs >/dev/null &&
             (apk add --no-cache intel-media-driver libvpl-gpu-rt >/dev/null 2>&1 ||
              apk add --no-cache intel-media-driver onevpl-intel-gpu >/dev/null 2>&1 ||
              apk add --no-cache intel-media-driver >/dev/null 2>&1 || true) &&
             pip install --no-cache-dir -q -U yt-dlp &&
             exec python -u /app/spelunkr2jellyfin.py --port 8765 --public-url $$PUBLIC_URL --gpu-device $$GPU"
