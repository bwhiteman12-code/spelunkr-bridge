# Spelunkr Bridge for Unraid (Compose Manager plugin) or any Docker host.
# 1. Change PUBLIC_URL to this server's LAN IP and TZ to your timezone.
# 2. For GPU encoding (Intel Quick Sync / VAAPI) keep the /dev/dri device. Set GPU to the render
#    node Jellyfin uses (Dashboard > Playback > Transcoding > QSV Device), or leave it empty to try each.
#    No Intel GPU? Delete the "devices" lines; it encodes on the CPU.
# 3. docker compose up -d
# To use your own channel list, put a channels.json in the /config folder and restart.
services:
  spelunkr:
    image: ghcr.io/bwhiteman12-code/spelunkr-bridge:latest
    container_name: spelunkr
    restart: unless-stopped
    ports:
      - "8765:8765"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/user/appdata/spelunkr:/config
    environment:
      - TZ=America/Chicago
      - PUBLIC_URL=http://192.168.1.10:8765
      - GPU=
      - EXTRA_ARGS=
