# Builds the Docker image and publishes it to ghcr.io/<owner>/spelunkr-bridge
# on every push to main (tag "latest") and every version tag like v1.1 (tag "1.1").
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # start the new image and print what's on, to prove it runs: once as shipped,
      # once with the starter channel from examples/
      - name: Smoke test
        run: |
          IMG=ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          docker run --rm -e UPDATE_YTDLP=false "$IMG" --now --only suplex
          docker run --rm -e UPDATE_YTDLP=false "$IMG" --now --only suplex,my-channel \
            --channels /app/examples/starter-channels.json | tee out.txt
          grep -q '"my-channel"' out.txt
